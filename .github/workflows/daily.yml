name: daily puzzle

on:
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_letters.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || { git commit -am "puzzle $(date -u +%F)" && git push; }
